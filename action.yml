name: deslop-kitten
description: Checks each pull request against your contribution policy and posts one comment with what to fix and who sent it.
author: jadidbourbaki
branding:
  icon: shield
  color: gray-dark

inputs:
  policy:
    description: Path to the policy file inside the repository.
    required: false
    default: .github/deslop-kitten.yaml
  comment:
    description: Post the report as a single comment on the pull request, updated in place on reruns. Needs pull-requests write permission.
    required: false
    default: "true"
  judge-url:
    description: OpenAI-compatible base URL of a disclosure judge. Empty skips the disclosure check.
    required: false
    default: ""
  judge-model:
    description: Model name to request from the disclosure judge.
    required: false
    default: local
  github-token:
    description: Token used to read the pull request and post the comment.
    required: false
    default: ${{ github.token }}

# The pull request itself comes from GITHUB_REPOSITORY and GITHUB_REF,
# which the runner sets on every job.
runs:
  using: docker
  image: Dockerfile
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
  args:
    - score
    - --policy
    - ${{ inputs.policy }}
    - --comment=${{ inputs.comment }}
    - --judge-url
    - ${{ inputs.judge-url }}
    - --judge-model
    - ${{ inputs.judge-model }}
    - --summary
