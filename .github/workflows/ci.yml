name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# CI is `just check` plus an image build. If you change a step, change it
# in the justfile too.

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v4
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" latest
      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee
      - name: Check (build + test -race + lint + links)
        run: just check
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  image:
    name: Action image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t vetkitten:ci .
      - name: Smoke test
        run: docker run --rm vetkitten:ci presets
