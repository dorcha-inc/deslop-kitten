# The AI Guidance section of the Kubernetes pull request guide. A
# contributor who used AI tools discloses it in the description. Listing
# AI tooling as a co-author or using assisted-by, co-developed, or
# similar trailers is not allowed, because the tool cannot sign the CLA.
preset: default
source: https://github.com/kubernetes/community/blob/master/contributors/guide/pull-requests.md#ai-guidance
require_ai_disclosure: true
forbid_ai_trailers: true
